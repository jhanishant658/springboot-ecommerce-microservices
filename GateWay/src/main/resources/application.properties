spring.application.name=GateWay
server.port=8080

spring.cloud.gateway.server.webmvc.routes[0].id=UserService
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USERSERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/user/**

spring.cloud.gateway.server.webmvc.routes[1].id=OrderService
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ORDERSERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/order/**

spring.cloud.gateway.server.webmvc.routes[2].id=Product-Service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/products/**

spring.cloud.gateway.server.webmvc.routes[3].id=cart-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://CART-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/cart/**

spring.cloud.gateway.server.webmvc.routes[4].id=notification-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://NOTIFICATIONSERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.server.webmvc.routes[5].id=wallet-route
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://PAYMENTSERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/wallets/**

spring.cloud.gateway.server.webmvc.routes[6].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://INVENTORYSERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/stocks/**

spring.cloud.gateway.server.webmvc.routes[7].id=payment-route
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://PAYMENTSERVICE
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/v1/payments/**

eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}

# JWT
jwt.secret=change-this-secret-in-production-change-this-secret-in-production
jwt.expiration-ms=86400000

